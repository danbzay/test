name: Multiple Homeworks Publishing

on:
  push:
    branches: [ "main" ]

    
env:
  HOME_URL: 'https://danbzay.github.io/test'
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - page-path: '9-JavaScript-browser/2-DOM/hit-game/'
            page-name: 'hit-game'

    steps:              
    - name: Add test artifact an test regex
      id: check_page    
      continue-on-error: true
      run: |
        regex_page_path=$(echo "${{ matrix.page-path }}" | sed 's/[.\/]/\\&/g')
        echo 'regex_page_path='$regex_page_path
        echo $HOME_URL/${{ matrix.page-name }}
        git show --dirstat --name-only HEAD | grep -e $regex_page_path -e workflows || 
          ((echo 'grep status='$?; wget -r -np -P ${{ matrix.page-path }}dist $HOME_URL/${{ matrix.page-name }}) &&
          (echo 'wget status='$?; echo 'saved=true' >> $GITHUB_OUTPUT))

    - name: check variables
      run: |
        echo 'steps.check_page.outputs.page_modified:' ${{ steps.check_page.outputs.page_modified }}
        echo 'steps.deployment.outputs.page_url:'  ${{ steps.deployment.outputs.page_url }} 


    - name: Upload Page Artifact
      uses: actions/upload-pages-artifact@v4
      id: deployment
      with:
        path: dist
        
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    
    steps:      
      
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
      
    - name: download published
      run: | 
        wget -r -np ${{ steps.deployment.outputs.page_url }}
        ls

