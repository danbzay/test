name: Multiple Homeworks Publishing

on:
  push:
    branches: [ "main" ]
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - page-path: '9-JavaScript-browser/2-DOM/hit-game/'
            page-name: 'hit-game'

    steps:              
    - name: Add test artifact an test regex
      id: check_page    
      continue-on-error: true
      run: |
        mkdir dist
        echo 'test artifact' > dist/test-artifact
        echo ${{ github.event.inputs.source_run_id }}
        regex_page_path=$(echo "${{ matrix.page-path }}" | sed 's/[.\/]/\\&/g')
        echo $regex_page_path 
        echo ${{ matrix.page-name }} | grep $regex_page_path || 
        echo 'page_modified=false' >> $GITHUB_OUTPUT

    - name: check variables
      run: |
        echo 'steps.check_page.outputs.page_modified:' ${{ steps.check_page.outputs.page_modified }}
        echo 'github.event.inputs.source_run_id:' ${{ github.event.inputs.source_run_id }}

    - name: Check artifact if page not modified
      id: check_artifact
      if: ${{steps.check_page.outputs.page_modified != false }}
      uses: actions/download-artifact@v4
      continue-on-error: true
      with: 
        name: ${{ matrix.page-name }}
        run-id: ${{ github.event.inputs.source_run_id }}
        
    - name: Upload Page Artifact
      uses: actions/upload-artifact@v4
      with:
        path: dist
        name: ${{ matrix.page-name }}
        retention-days: 30
        overwrite: true


