
name: Test

on:
  push:
    branches: [ "main" ]    

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}

    steps:
      - uses: actions/checkout@v4

      - name: Define matrix
        id: tasks
        run : (printf %s "tasks="; cat tasks.json) >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        tasks: ${{ fromJSON(needs.prepare.outputs.tasks) }}

    steps:
      - name: show matrix
        run: echo ${{ matrix }}
        


