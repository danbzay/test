
name: Test

on:
  push:
    branches: [ "main" ]  
    
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix data from file
        id: set-matrix
        run: |
          echo "matrix=$(jq -c . < ./pages.json)" >> $GITHUB_OUTPUT

      - name: Create index.html
        run: | 
          cat index | \
          sed -e '/\$/! s/^/echo \"/' -e '/\$/! s/$/\"/' -e '/\$/ s/\$//' | \
          bash >> index.html;
          
        

  run-matrix-jobs:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      matrix: 
        instance: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Run job for matrix item
        run: echo "Running for page ${{ matrix.instance.page }}"

        


