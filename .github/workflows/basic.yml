
name: Test

on:
  push:
    branches: [ "main" ]    

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tasks: ${{ steps.set_tasks.outputs.tasks }}

    steps:
      - uses: actions/checkout@v4

      - name: Define matrix
        id: set_tasks
        run : |
          tasks=`cat tasks.json`
          tasks="${tasks//'%'/'%25'}"
          tasks="${tasks//$'\n'/'%0A'}"
          tasks="${tasks//$'\r'/'%0D'}"
          echo "tasks=$tasks"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - run: |
          echo "${{fromJson(steps.set_tasks.outputs.tasks)}}"

  test:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        tasks: ${{ fromJSON(needs.prepare.outputs.tasks) }}

    steps:
      - name: show matrix
        run: echo ${{ matrix }}
        


