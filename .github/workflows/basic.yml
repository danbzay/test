
name: Test

on:
  push:
    branches: [ "main" ]  
    
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix data from file
        id: set-matrix
        run: |
          echo "matrix=$(jq -c . < ./pages.json)" >> $GITHUB_OUTPUT

      - name: Create index.html
        run: | 
          cat index | \
          sed -e '/\$/! s/^/echo \"/' -e '/\$/! s/$/\"/' -e '/\$/ s/\$//' | \
          bash > publish/index.html;
          cat publish/index.html;

      - name: Upload index.html
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  run-matrix-jobs:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      matrix: 
        page: ${{ fromJson(needs.configure.outputs.matrix) }}
        include:
          - node-version: 22.x

    steps:
      - name: Run job for matrix item
        run: |
          echo "Running for page ${{ matrix }}";
          touch publish/${{ (matrix.page.name) }};
          git pull;
          git add publish;
          git push;

  deploy:
    runs-on: ubuntu-latest
    needs: run-matrix-jobs
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4        


