
name: Test

on:
  push:
    branches: [ "main" ]  
    
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix data from file
        id: set-matrix
        run: |
          # Assuming config.json contains a JSON array, e.g., [{"target": "dev"}, {"target": "qa"}]
          echo "matrix=$(jq -c . < ./config.json)" >> $GITHUB_OUTPUT

  run-matrix-jobs:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
      - name: Run job for matrix item
        run: echo "Running for target ${{ matrix.target }}"

        


