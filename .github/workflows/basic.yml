name: Multiple Homeworks Publishing

on:
  push:
    branches: [ "main" ]

    
env:
  HOME_URL: 'https://danbzay.github.io/js-browser'
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - page-path: '2-DOM/hit-game/'
            page-name: 'hit-game'

    steps:              
    - name: Add test artifact an test regex
      id: check_page    
      continue-on-error: true
      run: |
        echo $HOME_URL/${{ matrix.page-name }} 
        wget -r -np -P ${{ matrix.page-name }}/dist $HOME_URL/${{ matrix.page-name }}
        ls -R

        

    - name: check variables
      run: |
        echo 'steps.check_page.outputs.page_modified:' ${{ steps.check_page.outputs.page_modified }}
        echo 'steps.deployment.outputs.page_url:'  ${{ steps.deployment.outputs.page_url }} 


    - name: Upload Page Artifact
      uses: actions/upload-pages-artifact@v4
      id: deployment
      with:
        path: dist
        
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    
    steps:      
      
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
      
    - name: download published
      run: | 
        wget -r -np ${{ steps.deployment.outputs.page_url }}
        ls

