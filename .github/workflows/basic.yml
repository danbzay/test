name: Multiple Homeworks Publishing

on:
  push:
    branches: [ "main" ]

    
env:
  HOME_URL: 'https://danbzay.github.io/js-browser'
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - page-path: '2-DOM/hit-game/'
            page-name: 'hit-game'

    steps:              
    - name: wget
      id: old_page    
      continue-on-error: true
      run: |
        echo $HOME_URL/${{ matrix.page-name }} 
        wget -r --no-parent --no-host-directories --cut-dirs=2 -P ./${{ matrix.page-name }}/dist $HOME_URL/${{ matrix.page-name }}
        mv ./${{ matrix.page-name }}/dist/${{ matrix.page-name }} ./${{ matrix.page-name }}/dist/index.html
        ls -R
        echo 'saved=true' >> $GITHUB_OUTPUT

    - name: check variables
      run: |
        echo 'steps.old_page.outputs.saved: '${{ steps.old_page.outputs.saved }}
        echo 'steps.deployment.outputs.page_url:'  ${{ steps.deployment.outputs.page_url }} 


    - name: Upload Page Artifact
      if: steps.old_page.outputs.saved == true
      uses: actions/upload-pages-artifact@v4
      id: deployment
      with:
        path: ./${{ matrix.page-name }}/dist
        
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    
    steps:      
      
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
      
    - name: download published
      run: | 
        wget -r -np ${{ steps.deployment.outputs.page_url }}
        ls

